<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <!-- White triangle lines with gap to prevent intersections with letters -->
  <line x1="232.5" y1="126.3" x2="267.1" y2="186.2" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <line x1="234.6" y1="242.5" x2="165.4" y2="242.5" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <line x1="132.9" y1="186.2" x2="167.5" y2="126.3" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  
  <!-- Letters at vertices (Top = E, Right = O, Left = N) -->
  <!-- E (Top) -->
  <text x="200" y="102" text-anchor="middle" font-size="90" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" fill="#E295A4">E</text>
  <!-- O (Right) -->
  <text x="299.6" y="274.5" text-anchor="middle" font-size="90" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" fill="#FF5696">O</text>
  <!-- N (Left) -->
  <text x="100.4" y="274.5" text-anchor="middle" font-size="90" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" fill="#A2D729">N</text>
</svg>
